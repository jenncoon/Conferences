name: Add a presentation
description: Add a conference presentation to the landing page.
title: "Add presentation: "
body:
  - type: markdown
    attributes:
      value: |
        Fill this out and select **Submit new issue**. In a few seconds a comment will appear here confirming the change, and the landing page will update within a minute or two.

        If you have a demo folder or slides file to share, upload it to the **presentations** folder first.

  - type: input
    id: title
    attributes:
      label: Presentation title
      placeholder: "Concept Checks That Work"
    validations:
      required: true

  - type: input
    id: conference
    attributes:
      label: Conference name
      placeholder: "Example Teaching and Learning Conference"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date presented
      description: "Use year-month-day, for example 2026-03-12. For a multi-day conference, use the day you presented."
      placeholder: "2026-03-12"
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: "City and state, or Virtual."
      placeholder: "Dallas, TX"
    validations:
      required: false

  - type: dropdown
    id: session_type
    attributes:
      label: Session type
      options:
        - Presentation
        - Workshop
        - Keynote
        - Panel
        - Poster
        - Lightning talk
        - Virtual session
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: "One to three sentences about the session. Plain text only."
    validations:
      required: false

  - type: input
    id: demo
    attributes:
      label: HTML demo (folder name or web link)
      description: "The folder name you uploaded into presentations, such as concept-checks. Or paste a full web link that starts with https://. Leave blank if there is no demo."
      placeholder: "concept-checks"
    validations:
      required: false

  - type: input
    id: slides
    attributes:
      label: Slides file (optional)
      description: "The file name inside the same folder, such as slides.pptx. Or a path like other-folder/slides.pptx, or a full web link. Leave blank if you are not sharing slides."
      placeholder: "slides.pptx"
    validations:
      required: false
