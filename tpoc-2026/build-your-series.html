<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Own Weekly Story Series</title>
<style>
  :root{
    --navy:#232338; --lime:#D4E16D; --sky:#A7CEE9; --tint:#F1F5CC; --tint2:#E4F0F8;
    --grey:#4A4A60; --line:#D9DBE6; --bg:#FAFAFC;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:"Merriweather Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.55}
  header{background:var(--navy);color:#fff;padding:28px 20px}
  header .wrap{max-width:820px;margin:0 auto}
  header h1{margin:0 0 6px;font-size:1.6rem;color:var(--lime);line-height:1.25}
  header p{margin:0;color:#fff;opacity:.9}
  main{max-width:820px;margin:0 auto;padding:24px 20px 60px}
  .progress{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none}
  .progress li{flex:1;height:8px;border-radius:4px;background:var(--line)}
  .progress li.done{background:var(--navy)}
  .progress li.now{background:var(--lime);outline:2px solid var(--navy)}
  .stepcount{font-size:.85rem;font-weight:700;letter-spacing:.06em;color:var(--grey);text-transform:uppercase;margin:0 0 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
  h2{margin:0 0 8px;font-size:1.5rem;line-height:1.3}
  .tip{background:var(--tint);border-radius:10px;padding:12px 14px;margin:14px 0;font-size:.95rem}
  label,.lbl{display:block;font-weight:700;margin:16px 0 6px}
  textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--navy);padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:130px;resize:vertical}
  textarea:focus,input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);border-color:var(--navy)}
  details{margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--tint2)}
  summary{cursor:pointer;padding:10px 14px;font-weight:700}
  details p{margin:0;padding:0 14px 14px}
  .choices{display:grid;gap:8px;margin:8px 0}
  .choices label{display:flex;gap:10px;align-items:center;font-weight:400;margin:0;padding:10px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}
  .choices input{width:auto;accent-color:var(--navy)}
  .choices label:has(input:checked){border-color:var(--navy);background:var(--tint)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;border-radius:10px;padding:12px 20px;cursor:pointer;border:2px solid var(--navy)}
  .primary{background:var(--navy);color:var(--lime)}
  .secondary{background:#fff;color:var(--navy)}
  .accent{background:var(--lime);color:var(--navy)}
  button:hover{filter:brightness(.95)}
  .answers{display:grid;gap:10px;margin:14px 0}
  .ans{border-radius:10px;padding:12px 14px;background:var(--tint)}
  .ans:nth-child(even){background:var(--tint2)}
  .ans b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
  .ans .q{font-size:.9rem;color:var(--grey);margin:2px 0 4px}
  .ans .a{white-space:pre-wrap}
  .ans .empty{color:var(--grey);font-style:italic}
  .ans button{margin-top:6px;padding:4px 10px;font-size:.85rem}
  pre#prompt{white-space:pre-wrap;background:var(--navy);color:#fff;border-radius:10px;padding:16px;font:inherit;font-size:.92rem;margin:8px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .note{font-size:.85rem;color:var(--grey)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:var(--lime);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Build Your Own Weekly Story Series</h1>
    <p>Answer eight short questions about your course. At the end you can download a summary and copy a starter prompt for an AI tool.</p>
  </div>
</header>
<main>
  <ol class="progress" id="progress" aria-label="Progress"></ol>
  <div id="app" aria-live="polite"></div>
  <p class="note" style="margin-top:18px;text-align:center">Jennifer Coon &middot; 2026 AI in Education Conference</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
var STORE = "story-series-builder-v1";

var STEPS = [
  { id:"course", title:"Start with your course", intro:"These details are used in your summary and your starter prompt.", fields:[
      {key:"course", label:"Course name", type:"text", ph:"For example: Intro to Accounting"},
      {key:"field", label:"Discipline or field", type:"text", ph:"For example: accounting, nursing, biology"},
      {key:"weeks", label:"How many weeks will the series run?", type:"number", ph:"15"}
  ]},
  { id:"theme", name:"Theme", q:"What do my students already relate to or enjoy?",
    tip:"Choose something students can relate to. If you are comfortable, show them a little about your personal life.",
    ex:"My theme is my two dogs. Students enjoy seeing them, and it lets me share a little about my life." },
  { id:"spark", name:"Spark", q:"Is there a real moment that mirrors the profession?",
    tip:"Look for the story in real life. Think of a moment you noticed that looks like a working relationship in your field.",
    ex:"Over spring break 2026, my older dog was correcting and mentoring my new pup. It looked like a senior auditor mentoring a new auditor." },
  { id:"cast", name:"Cast and roles", q:"Who are the characters, and what role does each play?",
    tip:"Mirror a working relationship in your field, such as mentor and new hire, preceptor and new nurse, or master and apprentice.",
    ex:"Enzo, a senior auditor, mentors Estella, a junior associate, through her first placement. She is new to the \"firm,\" which is my accounting course." },
  { id:"content", name:"Content source", q:"What do my course objectives cover, and what is missing?",
    tip:"Start from your course objectives and turn them into short stories. To fill a gap, borrow objectives from a related course or another source.",
    ex:"I started with my objectives and borrowed objectives from Learning Frameworks (study habits), a course my students are not required to take." },
  { id:"format", name:"Story format", q:"How short will each story be, and what repeats every week?",
    tip:"Keep each story short and put the tasks first. Give the series an arc, with a beginning, a middle and an end.",
    ex:"About 100 words of story, followed by three practical notes. It starts with an onboarding week and ends with a promotion." },
  { id:"visuals", name:"Visuals", q:"Will you use AI images, real photos, or no images?",
    tip:"Be careful with AI images. Some students dislike AI and are turned off by AI-generated art.",
    choice:["AI-generated images","Real photos","A mix of both","No images","Not sure yet"],
    ex:"I made a set of four images with ChatGPT from photos of my dogs. I am considering real photos because some students dislike AI images." },
  { id:"placement", name:"Placement", q:"Where and when will students see it?",
    tip:"Decide where the story lives and when it appears so students know where to look.",
    ex:"It is part of my weekly announcement in the course, and it comes first." },
  { id:"cta", name:"Call to action", q:"What do I want students to do after reading it?",
    tip:"End each story with a call to action. Invite students to respond, answer a question, or share something about themselves.",
    ex:"Ask students to reply with one thing they will do this week." }
];

var state = load();
var current = state.step || 0;
var TOTAL = STEPS.length + 1; // last screen is the summary

function load(){
  try { return JSON.parse(localStorage.getItem(STORE)) || {a:{}, step:0}; }
  catch(e){ return {a:{}, step:0}; }
}
function save(){
  state.step = current;
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){}
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function A(k){ return (state.a[k]||"").trim(); }

function renderProgress(){
  var ol = document.getElementById("progress"), h = "";
  for (var i=0;i<TOTAL;i++){
    h += '<li class="'+(i<current?'done':i===current?'now':'')+'"></li>';
  }
  ol.innerHTML = h;
}

function render(){
  save(); renderProgress();
  var app = document.getElementById("app");
  if (current >= STEPS.length) { app.innerHTML = summaryHTML(); wireSummary(); window.scrollTo(0,0); return; }
  var s = STEPS[current], h = '<section class="card">';
  h += '<p class="stepcount">'+(current===0?'Getting started':'Decision '+current+' of '+(STEPS.length-1)+' &middot; '+esc(s.name))+'</p>';
  if (current===0){
    h += '<h2>'+esc(s.title)+'</h2><p>'+esc(s.intro)+'</p>';
    s.fields.forEach(function(f){
      h += '<label for="f_'+f.key+'">'+esc(f.label)+'</label><input id="f_'+f.key+'" data-key="'+f.key+'" type="'+f.type+'" placeholder="'+esc(f.ph)+'" value="'+esc(state.a[f.key]||"")+'"'+(f.type==="number"?' min="1" max="60"':'')+'>';
    });
  } else {
    h += '<h2>'+esc(s.q)+'</h2><div class="tip"><b>Tip:</b> '+esc(s.tip)+'</div>';
    if (s.choice){
      h += '<div class="lbl" id="clbl">Your choice</div><div class="choices" role="radiogroup" aria-labelledby="clbl">';
      s.choice.forEach(function(c,i){
        h += '<label><input type="radio" name="vis" value="'+esc(c)+'"'+(state.a.visuals_choice===c?' checked':'')+'> '+esc(c)+'</label>';
      });
      h += '</div>';
    }
    h += '<label for="f_'+s.id+'">'+(s.choice?'Notes (optional)':'Your answer')+'</label><textarea id="f_'+s.id+'" data-key="'+s.id+'" placeholder="Type here. A rough idea is fine.">'+esc(state.a[s.id]||"")+'</textarea>';
    h += '<details><summary>See my example</summary><p>'+esc(s.ex)+'</p></details>';
  }
  h += '<div class="nav"><button class="secondary" id="back"'+(current===0?' disabled style="opacity:.4;cursor:default"':'')+'>Back</button>';
  h += '<button class="primary" id="next">'+(current===STEPS.length-1?'See my summary':'Next')+'</button></div></section>';
  app.innerHTML = h;
  app.querySelectorAll("[data-key]").forEach(function(el){
    el.addEventListener("input", function(){ state.a[el.dataset.key] = el.value; save(); });
  });
  app.querySelectorAll('input[name="vis"]').forEach(function(el){
    el.addEventListener("change", function(){ state.a.visuals_choice = el.value; save(); });
  });
  document.getElementById("back").onclick = function(){ if(current>0){ current--; render(); } };
  document.getElementById("next").onclick = function(){ current++; render(); };
  var first = app.querySelector("[data-key]"); if (first) first.focus({preventScroll:true});
  window.scrollTo(0,0);
}

function rows(){
  var out = [];
  STEPS.slice(1).forEach(function(s){
    var v = A(s.id);
    if (s.choice && A("visuals_choice")) v = A("visuals_choice") + (v ? ". " + v : "");
    out.push({name:s.name, q:s.q, v:v, idx:STEPS.indexOf(s)});
  });
  return out;
}
function title(){ return A("course") ? A("course") : "My course"; }

function promptText(){
  var weeks = A("weeks") || "15";
  var p = "I teach " + (A("course")||"a course") + (A("field")?" ("+A("field")+")":"") + " and want to build a weekly story series that runs about " + weeks + " weeks. The goal is to help my students feel connected to me and to the course.\n\nHere is my plan so far:\n";
  rows().forEach(function(r){
    p += "- " + r.name + ": " + (r.v ? r.v.replace(/\n/g," ") : "(not decided yet, please suggest options)") + "\n";
  });
  p += "\nPlease help me by doing the following:\n";
  p += "1. Ask me up to three questions about anything that is unclear.\n";
  p += "2. Propose a " + weeks + "-week arc with a beginning, a middle and an end. For each week, give a short theme and the course objective it supports.\n";
  p += "3. Draft Week 1 as a short story in the format I described, with the tasks listed first and a closing call to action.\n";
  p += "4. Keep the characters and tone consistent from week to week.\n";
  var vc = A("visuals_choice");
  if (vc === "AI-generated images") p += "5. Suggest a short image description for each week that keeps my characters looking the same.\n";
  p += "\nDo not invent facts about my course. If you need more detail, ask me.";
  return p;
}

function summaryHTML(){
  var h = '<section class="card"><p class="stepcount">Your summary</p><h2>'+esc(title())+': story series plan</h2>';
  if (A("field")||A("weeks")) h += '<p>'+esc(A("field"))+(A("field")&&A("weeks")?' &middot; ':'')+(A("weeks")?esc(A("weeks"))+' weeks':'')+'</p>';
  h += '<div class="answers">';
  rows().forEach(function(r){
    h += '<div class="ans"><b>'+esc(r.name)+'</b><div class="q">'+esc(r.q)+'</div>'+
      (r.v?'<div class="a">'+esc(r.v)+'</div>':'<div class="a empty">Not answered yet</div>')+
      '<button class="secondary" data-edit="'+r.idx+'">'+(r.v?'Edit':'Answer')+'</button></div>';
  });
  h += '</div>';
  h += '<h2 style="font-size:1.2rem;margin-top:24px">Your starter prompt</h2><p class="note">Paste this into the AI tool you prefer, then review and edit everything it gives you.</p><pre id="prompt">'+esc(promptText())+'</pre>';
  h += '<div class="actions"><button class="accent" id="copy">Copy prompt</button><button class="primary" id="dlDoc">Download document (.doc)</button><button class="primary" id="dlPng">Download image (.png)</button></div>';
  h += '<div class="nav"><button class="secondary" id="back">Back</button><button class="secondary" id="reset">Start over</button></div></section>';
  return h;
}

function wireSummary(){
  document.getElementById("back").onclick = function(){ current = STEPS.length-1; render(); };
  document.getElementById("reset").onclick = function(){
    if (confirm("Clear all of your answers and start over?")) { state = {a:{}, step:0}; current = 0; render(); }
  };
  document.querySelectorAll("[data-edit]").forEach(function(b){
    b.onclick = function(){ current = +b.dataset.edit; render(); };
  });
  document.getElementById("copy").onclick = copyPrompt;
  document.getElementById("dlDoc").onclick = downloadDoc;
  document.getElementById("dlPng").onclick = downloadPng;
}

function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function copyPrompt(){
  var txt = promptText();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Prompt copied"); }, fallbackCopy);
  } else fallbackCopy();
  function fallbackCopy(){
    var r = document.createRange(); r.selectNodeContents(document.getElementById("prompt"));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand("copy"); toast("Prompt copied"); } catch(e){ toast("Select the prompt and copy it"); }
  }
}
function fname(ext){
  var base = (A("course")||"story-series").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "story-series";
  return base + "-plan." + ext;
}
function download(blob, name){
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function downloadDoc(){
  var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+esc(title())+'</title>'+
    '<style>body{font-family:Calibri,Arial,sans-serif;color:#232338;font-size:11pt}h1{font-size:20pt;color:#232338}h2{font-size:13pt;margin:14pt 0 2pt;color:#232338}p.q{color:#4A4A60;margin:0 0 2pt;font-size:10pt}p{margin:0 0 6pt}pre{white-space:pre-wrap;font-family:Calibri,Arial,sans-serif;background:#F1F5CC;padding:8pt}</style></head><body>';
  h += '<h1>'+esc(title())+': Story Series Plan</h1>';
  if (A("field")||A("weeks")) h += '<p>'+esc(A("field"))+(A("field")&&A("weeks")?' | ':'')+(A("weeks")?esc(A("weeks"))+' weeks':'')+'</p>';
  rows().forEach(function(r){
    h += '<h2>'+esc(r.name)+'</h2><p class="q">'+esc(r.q)+'</p><p>'+(r.v?esc(r.v).replace(/\n/g,"<br>"):'<i>Not answered yet</i>')+'</p>';
  });
  h += '<h2>Starter prompt</h2><pre>'+esc(promptText())+'</pre></body></html>';
  download(new Blob(["﻿"+h], {type:"application/msword"}), fname("doc"));
  toast("Document downloaded");
}

function wrap(ctx, text, maxW){
  var lines = [];
  String(text).split("\n").forEach(function(par){
    var words = par.split(/\s+/), line = "";
    if (!par.trim()) { lines.push(""); return; }
    words.forEach(function(w){
      var t = line ? line+" "+w : w;
      if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
    });
    lines.push(line);
  });
  return lines;
}
function downloadPng(){
  var W = 1200, pad = 56, inner = W - pad*2, scale = 2;
  var NAVY="#232338", LIME="#D4E16D", GREY="#4A4A60", T1="#F1F5CC", T2="#E4F0F8";
  var FONT = '"Segoe UI", Arial, sans-serif';
  var meas = document.createElement("canvas").getContext("2d");
  var items = rows().map(function(r){
    meas.font = "26px "+FONT; var al = wrap(meas, r.v || "Not answered yet", inner-48);
    meas.font = "20px "+FONT; var ql = wrap(meas, r.q, inner-48);
    return {r:r, al:al, ql:ql, h: 24+30+ql.length*26+8+al.length*34+24};
  });
  var headH = 190, total = headH + items.reduce(function(s,i){return s+i.h+16;},0) + 100;
  var c = document.createElement("canvas"); c.width = W*scale; c.height = total*scale;
  var ctx = c.getContext("2d"); ctx.scale(scale, scale);
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,total);
  ctx.fillStyle = NAVY; ctx.fillRect(0,0,W,headH);
  ctx.textBaseline = "top";
  ctx.fillStyle = LIME; ctx.font = "bold 44px "+FONT; ctx.fillText(title(), pad, 40, inner);
  ctx.fillStyle = "#fff"; ctx.font = "26px "+FONT; ctx.fillText("Weekly story series plan", pad, 104);
  var sub = [A("field"), A("weeks") ? A("weeks")+" weeks" : ""].filter(Boolean).join("  |  ");
  if (sub){ ctx.fillStyle = "#A7CEE9"; ctx.font = "22px "+FONT; ctx.fillText(sub, pad, 144, inner); }
  var y = headH + 24;
  items.forEach(function(it, i){
    ctx.fillStyle = i%2 ? T2 : T1;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(pad, y, inner, it.h, 14); else ctx.rect(pad, y, inner, it.h); ctx.fill();
    var ty = y+20;
    ctx.fillStyle = GREY; ctx.font = "bold 20px "+FONT; ctx.fillText(it.r.name.toUpperCase(), pad+24, ty); ty += 30;
    ctx.font = "20px "+FONT; it.ql.forEach(function(l){ ctx.fillText(l, pad+24, ty); ty += 26; }); ty += 8;
    ctx.fillStyle = it.r.v ? NAVY : GREY; ctx.font = (it.r.v?"":"italic ")+"26px "+FONT;
    it.al.forEach(function(l){ ctx.fillText(l, pad+24, ty); ty += 34; });
    y += it.h + 16;
  });
  ctx.fillStyle = GREY; ctx.font = "18px "+FONT; ctx.fillText("Jennifer Coon  |  2026 AI in Education Conference", pad, total-56);
  c.toBlob(function(b){ download(b, fname("png")); toast("Image downloaded"); }, "image/png");
}

render();
</script>
</body>
</html>
